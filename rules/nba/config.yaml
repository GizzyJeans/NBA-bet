# Bethero NBA configuration. Rules that read these keys: rules/nba/RULES.md (cited as cfg:section.key).
#
# Every setting carries `value`, `status`, `source`; UNVALIDATED settings also carry `rationale`.
# Status labels (RULES.md §0.1):
#   CONFIRMED    stated by Eric or visible in his screenshot; source names the date
#   CONFIRM      Eric decides; the value shown is the stricter default until he does
#   VALIDATED    evidence recorded in rules/nba/VALIDATION.md
#   UNVALIDATED  placeholder; may only make a gate stricter, never the reason a bet exists
#   UNCONFIRMED  platform semantics pending -> NB-FORMAT / NB-SETTLEMENT
#   FACT         external fact; source in RULES.md Appendix A
#   RULE         design choice defined in RULES.md
# Change control: RULES.md §17. Every change bumps meta.version and adds a CHANGELOG entry.

meta:
  version: 0.6.5
  updated: 2026-10-28
  rules: rules/nba/RULES.md
  changelog: rules/nba/CHANGELOG.md

